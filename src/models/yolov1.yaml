# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1   # number of classes
ns: 100 # number of symbols excluding the empty one

scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768] # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512] # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512] # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvBlock, [16,  [1,1]]]  # 0  v1  h1
  - [-1, 1, ConvBlock, [32,  [1,2]]]  # 1  v1  h2
  - [-1, 1, ConvBlock, [64,  [2,2]]]  # 2  v2  h4
  - [-1, 1, ConvBlock, [128, [2,2]]]  # 3  v4  h8
  - [-1, 1, ConvBlock, [256, [2,1]]]  # 4  v8  h8
  - [-1, 1, ConvBlock, [256, [2,1]]]  # 5  v16 h8
  - [-1, 1, DSCBlock,  [256]]         # 6  v16 h8
  - [-1, 1, DSCBlock,  [256]]         # 7  v16 h8
  - [-1, 1, DSCBlock,  [256]]         # 8  v16 h8
  - [-1, 1, DSCBlock,  [512]]         # 9  v16 h8
  
  - [[4], 1, Concat, [1]]             # 10  //  8
  - [7, 1, nn.AvgPool2d, [[1,2]]]     # 11  //  16
  - [9, 1, nn.AvgPool2d, [[1,2]]]     # 12  //  16
  - [-1, 1, nn.AvgPool2d, [[2,2]]]    # 13  //  32
  
  - [-1, 3, C2f, [512, True]]         # 14
  - [-1, 1, SPPF, [512, 5]]           # 15
  
  - [10, 6, C2f, [256, True]]         # 16
  - [11, 6, C2f, [256, True]]         # 17  
  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[15], 1, Concat, [1]]            # 19

# YOLOv8.0n head
head:
  - [[18, 17], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 21

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 16], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 19], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 30 (P5/32-large)
  
  - [[24, 27, 30], 1, Detect, [nc]] # Detect(P3, P4, P5)
  
htr:
    # Handwriting Recognition Head
  - [[9], 1, Concat, [1]]
  - [-1, 1, LineDecoderCTC, ['ns']]